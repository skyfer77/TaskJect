name: Deploy TaskJect to Azure App Service (Staging Slot, Linux, .NET 8)

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: taskject-staging
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TaskJect.Web/TaskJect.Web.csproj

      - name: Build (Release)
        run: dotnet build TaskJect.Web/TaskJect.Web.csproj -c Release --no-restore

      - name: Publish (Release)
        run: dotnet publish TaskJect.Web/TaskJect.Web.csproj -c Release -o ${{ github.workspace }}/publish

      - name: Zip publish output
        run: |
          cd ${{ github.workspace }}/publish
          zip -r ../artifact.zip .

      - name: Deploy to Azure Web App slot (Linux)
        uses: azure/webapps-deploy@v3
        with:
          app-name: taskject
          slot-name: test
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/artifact.zip
